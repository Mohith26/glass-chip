# VX-1 reference SoC
# VX-1 is a fictional reference SoC sized for a mid-range humanoid or arm controller.
# Parameters are assumptions chosen to put realistic workloads near contention limits.
# It is inspired by public descriptions of physical-AI SoCs and does not describe any real product.

name: VX-1
version: 1
process:
  node: generic-5nm-class        # assumption
  v_nominal: 0.75                # volts, assumption
  vth: 0.30                      # volts, assumption
  alpha: 1.3                     # alpha-power-law exponent, assumption

# 4x4 mesh. Each block attaches to one or more mesh nodes (x, y).
# The viz uses `floorplan` (normalized die coords, 0..1) to draw blocks.
noc:
  topology: mesh
  dims: [4, 4]
  link_bits: 256
  freq_hz: 1.5e9
  routing: xy
  virtual_channels: 4
  router_latency_cycles: 2
  link_latency_cycles: 1
  flit_bytes: 32
  max_packet_bytes: 256
  qos_classes: [safety, realtime, best_effort]
  power_domain: noc_cache

blocks:
  cpu_a:
    kind: cpu
    cores: 4
    isa: rv64gcv
    vlen_bits: 256
    freq_hz: 2.0e9
    l1d_kb: 64
    l1i_kb: 64
    l2_kb: 1024
    ipc_scalar: 2.0             # sustained, assumption
    vector_flops_per_cycle: 16  # FP32 per core with VLEN 256 FMA, assumption
    context_switch_ns: 2000
    nodes: [[0, 0]]
    power_domain: cpu_a
    floorplan: {x: 0.02, y: 0.02, w: 0.22, h: 0.22}
  cpu_b:
    kind: cpu
    cores: 4
    isa: rv64gcv
    vlen_bits: 256
    freq_hz: 2.0e9
    l1d_kb: 64
    l1i_kb: 64
    l2_kb: 1024
    ipc_scalar: 2.0
    vector_flops_per_cycle: 16
    context_switch_ns: 2000
    nodes: [[1, 0]]
    power_domain: cpu_b
    floorplan: {x: 0.26, y: 0.02, w: 0.22, h: 0.22}
  rt:
    kind: rtcpu
    cores: 2
    lockstep: true
    isa: rv64gc
    freq_hz: 1.2e9
    tcm_kb: 256
    ipc_scalar: 1.0
    nodes: [[2, 0]]
    power_domain: rt
    floorplan: {x: 0.50, y: 0.02, w: 0.20, h: 0.22}
  dsp:
    kind: dsp
    units: 2
    simd_bits: 1024
    freq_hz: 1.0e9
    ops_per_cycle_int8: 128     # per unit, assumption
    nodes: [[3, 0], [3, 1]]
    power_domain: dsp
    floorplan: {x: 0.72, y: 0.02, w: 0.26, h: 0.47}
  npu:
    kind: npu
    tiles: 4
    array: [64, 64]
    dataflow: weight_stationary
    freq_hz: 1.2e9
    int8_macs_per_cycle_per_tile: 4096
    bf16_rate_fraction: 0.25
    fp8_rate_fraction: 0.5
    sram_per_tile_kb: 2048
    shared_sram_kb: 4096
    preemption: layer
    preempt_save_restore_us: 20
    nodes: [[0, 1], [1, 1], [0, 2], [1, 2]]
    power_domain: npu
    floorplan: {x: 0.02, y: 0.26, w: 0.46, h: 0.46}
  simt:
    kind: simt
    compute_units: 4
    lanes_per_cu: 128
    freq_hz: 1.3e9
    shared_mem_kb_per_cu: 256
    launch_overhead_us: 5
    coalescing_efficiency: 0.7
    nodes: [[3, 2], [3, 3]]
    power_domain: simt
    floorplan: {x: 0.72, y: 0.51, w: 0.26, h: 0.47}
  sys_cache:
    kind: cache
    size_kb: 8192
    ways: 16
    line_bytes: 64
    hit_latency_cycles: 30
    partitionable: true
    nodes: [[2, 1], [2, 2]]
    power_domain: noc_cache
    floorplan: {x: 0.50, y: 0.26, w: 0.20, h: 0.46}
  dram:
    kind: dram
    standard: LPDDR5X
    data_rate_mts: 8533
    bus_bits_total: 128
    controllers: 2
    channels_per_controller: 2
    bank_groups: 4
    banks_per_group: 8
    row_bytes: 2048
    timing_ns: {tRCD: 18, tRP: 18, CL: 17, tRAS: 42, tRFC: 210, tREFI: 3900, tWTR: 10, tRTW: 8}
    scheduler: fr_fcfs
    nodes: [[0, 3], [2, 3]]
    power_domain: dram_io
    floorplan: {x: 0.02, y: 0.74, w: 0.46, h: 0.24}
  dma:
    kind: dma
    engines: 8
    descriptor_latency_ns: 200
    nodes: [[1, 3]]
    power_domain: noc_cache
    floorplan: {x: 0.50, y: 0.74, w: 0.20, h: 0.24}

# Power domains: each has an operating-performance-point (OPP) table.
# Frequencies are derived from voltage by the alpha-power law in power/vf.py
# so that f(v_nominal) equals the block's nominal frequency.
power_domains:
  cpu_a:     {v_min: 0.50, v_max: 0.85, opp_volts: [0.50, 0.55, 0.60, 0.65, 0.70, 0.75, 0.80, 0.85]}
  cpu_b:     {v_min: 0.50, v_max: 0.85, opp_volts: [0.50, 0.55, 0.60, 0.65, 0.70, 0.75, 0.80, 0.85]}
  rt:        {v_min: 0.55, v_max: 0.80, opp_volts: [0.55, 0.60, 0.65, 0.70, 0.75, 0.80]}
  npu:       {v_min: 0.45, v_max: 0.80, opp_volts: [0.45, 0.50, 0.55, 0.60, 0.65, 0.70, 0.75, 0.80]}
  simt:      {v_min: 0.50, v_max: 0.80, opp_volts: [0.50, 0.55, 0.60, 0.65, 0.70, 0.75, 0.80]}
  dsp:       {v_min: 0.50, v_max: 0.80, opp_volts: [0.50, 0.55, 0.60, 0.65, 0.70, 0.75, 0.80]}
  noc_cache: {v_min: 0.60, v_max: 0.80, opp_volts: [0.60, 0.65, 0.70, 0.75, 0.80]}
  dram_io:   {v_min: 0.50, v_max: 0.50, opp_volts: [0.50]}
  dvfs_transition_us: 20         # assumption
