# Added by the co-sim stream (Phase C, studies/s16_closed_loop.py); not generated by workloads/capture/scenarios.py.
# Why this is realistic: robot cells routinely record raw camera streams (dataset collection for
# fine-tuning a policy, incident logging), and people routinely walk up to a running cell to clear a
# jam or inspect a part. Two raw 4K30 streams are 11.9 Gbit/s (the S7 step value, 5.97 Gbit/s each).
# The person walks in at 1.6 m/s (the walking speed ISO 13855 assumes), leans over the far side of the
# conveyor, waits 2 s and leaves; this repeats every 8 s so one run yields several approaches.
# Rates and deadlines come from workloads/graphs/<task>.json (defaults, not measured requirements).
name: S9 Human enters during recording
description: Two raw 4K camera streams are being recorded while a person repeatedly walks into the workspace.
duration_s: 40.0
seed: 1
graph_dir: workloads/graphs
tasks:
- {graph: T1_ingest_wrist, enabled_at_s: 0.0}
- {graph: T1_ingest_overhead, enabled_at_s: 0.0}
- {graph: T2_detect, enabled_at_s: 0.0}
- {graph: T3_esdf, enabled_at_s: 0.0}
- {graph: T4_vla, enabled_at_s: 0.0}
- graph: T5_plan
  enabled_at_s: 0.0
  overrides: {sporadic_rate_hz: 2.0}
- {graph: T6_estimate, enabled_at_s: 0.0}
- {graph: T7_control, enabled_at_s: 0.0}
- {graph: T8_safety, enabled_at_s: 0.0}
- {graph: T10_record_4k, enabled_at_s: 0.0}
events:
- t_s: 0.0
  action: set_bitrate
  args: {task: T10_record_4k, bitrate_bps: 11900000000.0}
- {t_s: 6.0, action: human_enter, args: {from: front, speed_mps: 1.6, stop_x: 0.75, stop_y: -0.1, dwell_s: 2.0}}
- {t_s: 14.0, action: human_enter, args: {from: front, speed_mps: 1.6, stop_x: 0.75, stop_y: -0.1, dwell_s: 2.0}}
- {t_s: 22.0, action: human_enter, args: {from: front, speed_mps: 1.6, stop_x: 0.75, stop_y: -0.1, dwell_s: 2.0}}
- {t_s: 30.0, action: human_enter, args: {from: front, speed_mps: 1.6, stop_x: 0.75, stop_y: -0.1, dwell_s: 2.0}}
robot: {conveyor_speed_mps: 0.2, object_spacing_m: 0.25, human: true}
ambient_c: 25
transport: copy
executor: single_threaded
