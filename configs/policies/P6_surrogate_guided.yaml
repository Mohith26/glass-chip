# P6 surrogate guided: P4 with a surrogate upper bound on finish time (passed to
# PowerManager(surrogate=...)). Without a surrogate it behaves exactly like P4, unless
# placeholder_surrogate is true: then a conservative stand-in bound is used (not the conformal
# surrogate; results must be labeled placeholder).
name: P6_surrogate_guided
scheduler: edf
power: surrogate_guided
params:
  quantile: 0.95
  safety_quantile: 0.999
  prior_inflation: 1.25
  min_samples: 5
  window: 200
  margin_frac: 0.10
  margin_us: 50
  safety_margin_us: 100
  anticipate: true
  use_parallel_units: false
  deadline_margin_frac: 0.08         # slack reserved as a fraction of the relative deadline (0.05 gave ~0.2% T4 misses in 60 s pilots)
  safety_deadline_margin_frac: 0.10  # same, safety-critical tasks
  infrastructure_domains: [noc_cache] # shared memory-system domains stay at nominal
  govern_infrastructure: false       # true: utilization governor on them instead
  unmapped_target_util: 0.7          # governor target for compute domains no task uses
  placeholder_surrogate: false
  placeholder_factor: 1.5
  slack_feedback: true               # raise a task margin when its recent 5th-pct slack < base
  max_margin_frac: 0.30
  anchor_window: 50                  # nominal-clock samples kept for the time model
