# P5 offline optimal: not an online policy. A run with this config behaves like P0 and
# records the job trace; power/offline_opt.py solves the minimum-energy OPP assignment
# (HiGHS MILP) as a lower bound.
name: P5_offline_optimal
scheduler: edf
power: offline_optimal
params:
  slot_ms: 1.0
  gate_idle: true
  time_limit_s: 60
