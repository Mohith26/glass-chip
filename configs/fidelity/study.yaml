# Study mix: every component at transaction level. The NPU asks for L2
# (SCALE-Sim per-layer cycle tables); ops without a table fall back to L1 and
# sim.info() reports how many did. NoC/DRAM L2 adapters (BookSim 2 /
# Ramulator 2) are not attached yet, so L1 is requested here.
name: study
cpu: L1
npu: L2
simt: L1
dsp: L1
noc: L1
dram: L1
cache: L1
quantum_ns: 100
params:
  bulk_chunk_bytes: 4096      # bulk streams in 4 KB transactions
  cpu_miss_bytes: 64          # CPU misses at cache-line granularity
  cpu_mlp: 8                  # outstanding misses per core (assumption)
  cache_block_bytes: 256
  stream_bypass_bytes: 2000000
  exec_cv: 0.0
