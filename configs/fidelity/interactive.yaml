# Interactive mix: fast enough for live co-simulation.
# CPU, SIMT and DSP are analytic traffic sources (L0); the NPU, NoC, system
# cache and DRAM are transaction-level (L1) so memory contention is real.
name: interactive
cpu: L0
npu: L1
simt: L0
dsp: L0
noc: L1
dram: L1
cache: L1
quantum_ns: 100      # time quantum for external-simulator adapters (unused by built-in models)
params:
  bulk_chunk_bytes: 4096      # bulk streams move in 4 KB transactions (assumption)
  noc_model_requests: false   # 16 B request headers use zero-load latency; data messages reserve links
  cpu_miss_bytes: 64          # only used if cpu is L1
  cache_block_bytes: 1024     # tag granularity of the set-associative cache model
  stream_bypass_bytes: 2000000  # streams above 2 MB do not allocate in the system cache
  exec_cv: 0.0                # no execution-time noise by default (deterministic baseline)
