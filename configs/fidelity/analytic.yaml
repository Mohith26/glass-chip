# Analytic mix: every component at L0 (roofline per op, M/D/1 queueing for
# shared resources, fluid load on NoC and DRAM). Fastest; use for sweeps.
name: analytic
cpu: L0
npu: L0
simt: L0
dsp: L0
noc: L0
dram: L0
cache: L0
quantum_ns: 100
params:
  npu_l0_util: 0.8      # sustained MAC utilization at L0 (assumption)
  simt_l0_eff: 0.6      # sustained fraction of SIMT peak at L0 (assumption)
  dram_l0_eff: 0.8      # sustained fraction of DRAM peak at L0 (assumption)
