# Memory-focus mix (the "did we get the NoC right, is there a DRAM
# bottleneck" configuration): the CPU is an analytic traffic source, the
# NPU, SIMT and DSP issue real transactions, and bulk transactions
# are smaller (1 KB) so contention is resolved more finely.
name: memory_focus
cpu: L0
npu: L1
simt: L1
dsp: L1
noc: L1
dram: L1
cache: L1
quantum_ns: 100
params:
  bulk_chunk_bytes: 1024
  cache_block_bytes: 256
