- {graph: T2_detect, enabled_at_s: 0.0}
- {graph: T3_esdf, enabled_at_s: 0.0}
- {graph: T4_vla, enabled_at_s: 0.0}
- {graph: T5_plan, enabled_at_s: 0.0}
- {graph: T6_estimate, enabled_at_s: 0.0}
